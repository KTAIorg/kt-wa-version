# GitLab CI：接入中心模板（规范集中在 KTAIorg/kt-gitlab-ci，勿在此复制作业）
include:
  - project: 'KTAIorg/kt-gitlab-ci'
    ref: v1
    file: '/templates/auto.gitlab-ci.yml'

# 定时任务：WhatsApp Web 版本探测（原 .github/workflows/wa-update.yml，GitHub Actions 已停用）
# 产物（commit/tag）写回 GitHub 权威源；镜像同步带回 GitLab。
#
# 调度在 GitLab Project → Build → Pipeline schedules：
#   variable SCHED_JOB=wa-update
# 请将 cron 设为每天一次（例如 0 2 * * * UTC），不要每小时。
# 本文件 rules 只认 schedule + SCHED_JOB，频率由 GitLab schedule 控制。
wa:update:
  stage: test
  image: node:24.15.0
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHED_JOB == "wa-update"
  variables:
    GIT_DEPTH: "0"
  timeout: 30m
  script:
    - git config --global user.name "kt-ops-bot"
    - git config --global user.email "ops-bot@ktyun.cc"
    - git remote set-url origin "https://x-access-token:${KT_GH_TOKEN}@github.com/KTAIorg/kt-wa-version.git"
    - git fetch origin main && git checkout -B main origin/main
    - npm ci || npm install
    - chmod ug+x .husky/pre-commit || true
    - export GITHUB_OUTPUT=/tmp/wa.out && touch "$GITHUB_OUTPUT"
    - CI=true WA_COMMIT=true npm run wa-update
    - |
      out() { grep -E "^$1=" /tmp/wa.out | tail -1 | cut -d= -f2-; }
      notify() {  # $1=color $2=title $3=desc；无 webhook 则仅日志
        if [ -n "${DISCORD_WEBHOOK:-}" ]; then
          curl -sf -X POST -H 'Content-Type: application/json' \
            -d "{\"embeds\":[{\"color\":$1,\"title\":\"$2\",\"description\":\"$3\"}]}" \
            "$DISCORD_WEBHOOK" >/dev/null || echo "discord notify failed"
        else
          echo "NOTIFY[$2] $3"
        fi
      }
      if [ "$(out hasChanges)" = "true" ]; then
        git status && git clean -fd
        npm run release -- --ci -i patch
      else
        echo "no WhatsApp Web version changes"
      fi
      [ "$(out hasOutdated)" = "true" ] && notify 13312049 "Outdated WhatsApp WEB versions" "outdated: $(out outdated)"
      [ "$(out hasNewVersion)" = "true" ] && notify 2664261 "New version for WhatsApp WEB!" "version: $(out version)"
      true
