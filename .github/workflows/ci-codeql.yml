# S1：默认分支 + 每周。不要每个 GitOps/文档 PR 都扫。
# 合入本文件后关闭 CodeQL Default Setup，避免双跑。
name: CodeQL
on:
  push:
    branches: [main]
    paths:
      - "**/*.go"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.py"
      - "go.mod"
      - "go.sum"
      - "package-lock.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/ci-codeql.yml"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  actions: read
  contents: read
  security-events: write
jobs:
  codeql:
    uses: KTAIorg/kt-workflows/.github/workflows/codeql.yml@v1
