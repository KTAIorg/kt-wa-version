# Auto-requests @github-copilot review on every new non-draft PR.
# Powered by the reusable workflow in KTAIorg/.github.
# Requires: Organization Settings > Copilot > Code review > enabled
name: Auto Copilot Review

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

jobs:
  copilot-review:
    if: github.event.pull_request.draft == false
    uses: KTAIorg/.github/.github/workflows/copilot-review.yml@main
    permissions:
      pull-requests: write
